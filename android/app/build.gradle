plugins {
    id "com.android.application"
}

def has_ci_signing_env = System.getenv("ANDROID_KEYSTORE_PATH") &&
    System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
    System.getenv("ANDROID_KEY_ALIAS") &&
    System.getenv("ANDROID_KEY_PASSWORD")
def prebuilt_voxov_so = System.getenv("VOXOV_ANDROID_PREBUILT_SO")
def use_prebuilt_voxov_so = prebuilt_voxov_so && file(prebuilt_voxov_so).exists()

if (use_prebuilt_voxov_so) {
    logger.lifecycle("Using prebuilt native lib: ${prebuilt_voxov_so}")
}

android {
    namespace "com.voxov.game"
    compileSdk 34
    ndkVersion "26.1.10909125"

    signingConfigs {
        release {
            if (has_ci_signing_env) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.voxov.game"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        if (!use_prebuilt_voxov_so) {
            externalNativeBuild {
                cmake {
                    arguments "-DVOXOV_ENABLE_VULKAN=OFF"
                    targets "voxov_android"
                }
            }
        }
    }

    sourceSets {
        main {
            if (use_prebuilt_voxov_so) {
                jniLibs.srcDirs += ["${buildDir}/generated/prebuiltJniLibs"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (has_ci_signing_env) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libvoxov.so"]
        }
    }

    if (!use_prebuilt_voxov_so) {
        externalNativeBuild {
            cmake {
                path "../../CMakeLists.txt"
                version "3.22.1"
            }
        }
    }
}

if (use_prebuilt_voxov_so) {
    tasks.register("preparePrebuiltVoxovSo", Copy) {
        from(prebuilt_voxov_so)
        into("${buildDir}/generated/prebuiltJniLibs/arm64-v8a")
        rename { "libvoxov.so" }
    }

    tasks.configureEach { task ->
        if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
            task.dependsOn("preparePrebuiltVoxovSo")
        }
    }
}
