name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            xvfb \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Configure
        run: |
          cmake -S . -B build/desktop/release-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOXOV_BUILD_TESTS=OFF \
            -DUSE_AVX2=OFF \
            -DUSE_F16C=OFF \
            -DUSE_FMADD=OFF \
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build/desktop/release-linux --parallel

      - name: Prepare linux artifact bundle
        run: |
          ASSET_DIR="VOXOV-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "${ASSET_DIR}/assets"
          cp build/desktop/release-linux/bin/voxov "${ASSET_DIR}/"
          chmod +x "${ASSET_DIR}/voxov"
          cp -R assets/fonts "${ASSET_DIR}/assets/"
          cat > "${ASSET_DIR}/run.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "${SCRIPT_DIR}/voxov" "$@"
          EOF
          chmod +x "${ASSET_DIR}/run.sh"
          tar -czf "${ASSET_DIR}.tar.gz" "${ASSET_DIR}"

      - name: Validate linux artifact bundle
        run: |
          ASSET_DIR="VOXOV-${GITHUB_REF_NAME}-linux-x86_64"
          ASSET_TGZ="${ASSET_DIR}.tar.gz"
          mkdir -p smoke-linux
          tar -xzf "${ASSET_TGZ}" -C smoke-linux
          test -x "smoke-linux/${ASSET_DIR}/voxov"
          test -x "smoke-linux/${ASSET_DIR}/run.sh"
          test -f "smoke-linux/${ASSET_DIR}/assets/fonts/IBMPlexMono-Regular.ttf"
          ldd "smoke-linux/${ASSET_DIR}/voxov" | tee /tmp/voxov-linux-ldd.txt
          if grep -q "not found" /tmp/voxov-linux-ldd.txt; then
            echo "Unresolved runtime dependency in linux bundle"
            exit 1
          fi
          set +e
          timeout 10s xvfb-run -a "smoke-linux/${ASSET_DIR}/run.sh" >/tmp/voxov-linux-smoke.log 2>&1
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
            echo "Linux bundle startup smoke test failed (rc=${smoke_rc})"
            cat /tmp/voxov-linux-smoke.log
            exit 1
          fi

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: VOXOV-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build/desktop/release-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVOXOV_BUILD_TESTS=OFF `
            -DENABLE_ALL_WARNINGS=OFF `
            -DJPH_USE_DX12=OFF `
            -DJPH_USE_DXC=OFF `
            -DUSE_AVX2=OFF `
            -DUSE_F16C=OFF `
            -DUSE_FMADD=OFF `
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build/desktop/release-windows --parallel

      - name: Prepare windows artifact
        shell: powershell
        run: |
          $AssetDir = "VOXOV-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$AssetDir/assets" | Out-Null
          Copy-Item "build/desktop/release-windows/bin/voxov.exe" "$AssetDir/" -Force
          Copy-Item "build/desktop/release-windows/bin/*.dll" "$AssetDir/" -ErrorAction SilentlyContinue
          Copy-Item "assets/fonts" "$AssetDir/assets/" -Recurse -Force
          $AssetZip = "$AssetDir.zip"
          Compress-Archive -Path "$AssetDir/*" -DestinationPath $AssetZip -Force

      - name: Validate windows artifact bundle
        shell: powershell
        run: |
          $AssetDir = "VOXOV-$env:GITHUB_REF_NAME-windows-x86_64"
          $AssetZip = "$AssetDir.zip"
          $SmokeDir = Join-Path $PWD "smoke-windows"
          if (Test-Path $SmokeDir) { Remove-Item $SmokeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $SmokeDir | Out-Null
          Expand-Archive -Path $AssetZip -DestinationPath $SmokeDir -Force
          if (-not (Test-Path "$SmokeDir/voxov.exe")) { throw "voxov.exe missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libgcc_s_seh-1.dll")) { throw "libgcc_s_seh-1.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libstdc++-6.dll")) { throw "libstdc++-6.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libwinpthread-1.dll")) { throw "libwinpthread-1.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/assets/fonts/IBMPlexMono-Regular.ttf")) { throw "IBMPlexMono-Regular.ttf missing from windows bundle" }
          $proc = Start-Process -FilePath "$SmokeDir/voxov.exe" -WorkingDirectory $SmokeDir -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "voxov.exe exited early with code $($proc.ExitCode)"
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: VOXOV-${{ github.ref_name }}-windows-x86_64.zip

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Decode test keystore
        run: |
          echo "${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/voxov-test-upload.jks"

      - name: Build signed APK (Release)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/voxov-test-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK contains native library
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "${APK_PATH}"
          unzip -l "${APK_PATH}" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libvoxov.so" /tmp/apk-contents.txt

      - name: Prepare android artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "VOXOV-${GITHUB_REF_NAME}-android-arm64-v8a.apk"

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: VOXOV-${{ github.ref_name }}-android-arm64-v8a.apk

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]

    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist/release-linux
          if-no-files-found: error

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/release-android
          if-no-files-found: error

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/release-windows
          if-no-files-found: error

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -print -exec cp {} release/ \;
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VOXOV ${{ github.ref_name }} (Linux/Windows/Android)
          generate_release_notes: true
          files: release/*
