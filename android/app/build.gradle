plugins {
    id "com.android.application"
}

def has_ci_signing_env = System.getenv("ANDROID_KEYSTORE_PATH") &&
    System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
    System.getenv("ANDROID_KEY_ALIAS") &&
    System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace "com.voxov.game"
    compileSdk 34
    ndkVersion "26.1.10909125"

    signingConfigs {
        release {
            if (has_ci_signing_env) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.voxov.game"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DVOXOV_ENABLE_VULKAN=OFF"
                targets "voxov_android"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (has_ci_signing_env) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
