<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOXOV</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: #121722;
      --panel-strong: #171f2e;
      --text: #f4f7fb;
      --muted: #9da8b7;
      --line: #283344;
      --accent: #f2c14e;
      --accent-strong: #ffdf7e;
      --blue: #54b7ff;
      --green: #54d38a;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
    }

    main {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 34px;
      align-items: center;
    }

    .hero {
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }

    .mark {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 10px;
      color: var(--accent-strong);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .mark::before {
      width: 12px;
      height: 12px;
      content: "";
      background: var(--accent);
      box-shadow: 18px 0 0 var(--blue), 36px 0 0 var(--green);
    }

    h1 {
      margin: 0;
      max-width: 9ch;
      font-size: clamp(4.2rem, 15vw, 10rem);
      line-height: 0.82;
      letter-spacing: 0;
    }

    .summary {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    a {
      color: inherit;
    }

    .button,
    .download {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 18px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .button {
      background: var(--accent);
      color: #15120a;
    }

    .download {
      background: var(--panel);
      border-color: var(--line);
      color: var(--text);
    }

    .scene {
      position: relative;
      min-height: 540px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(84, 183, 255, 0.16), transparent 38%),
        linear-gradient(0deg, rgba(8, 10, 15, 0.92), rgba(8, 10, 15, 0.1)),
        #101722;
    }

    .grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-auto-rows: 56px;
      transform: perspective(680px) rotateX(58deg) translateY(78px) scale(1.22);
      transform-origin: bottom center;
      opacity: 0.95;
    }

    .tile {
      border: 1px solid rgba(255, 255, 255, 0.055);
      background: rgba(22, 31, 46, 0.7);
    }

    .tile:nth-child(5n) {
      background: rgba(84, 183, 255, 0.23);
    }

    .tile:nth-child(9n) {
      background: rgba(84, 211, 138, 0.25);
    }

    .block {
      position: absolute;
      width: 74px;
      height: 74px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: var(--panel-strong);
      box-shadow: 0 24px 34px rgba(0, 0, 0, 0.35);
    }

    .block::before {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 50%);
    }

    .block.one {
      right: 22%;
      top: 20%;
      background: #1d5d7c;
    }

    .block.two {
      right: 42%;
      top: 37%;
      background: #6c5c21;
    }

    .block.three {
      right: 14%;
      bottom: 21%;
      background: #27643f;
    }

    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width: 820px) {
      body {
        padding: 22px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;
      }

      .scene {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="mark">Voxel vehicle combat</div>
      <h1 id="title">VOXOV</h1>
      <p class="summary">Build, drive, and break apart voxel machines in a compact engine testbed for fast physics, rendering, and game systems.</p>
      <div class="actions">
        <a class="button" href="play.html">Play Now</a>
        <nav class="downloads" aria-label="Downloads">
          <a class="download" href="https://github.com/kyambuthia/voxov/releases/latest">Windows</a>
          <a class="download" href="https://github.com/kyambuthia/voxov/releases/latest">Linux</a>
          <a class="download" href="https://github.com/kyambuthia/voxov/releases/latest">Android</a>
        </nav>
      </div>
    </section>
    <section class="scene" aria-label="Voxel scene preview">
      <div class="grid" aria-hidden="true">
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      </div>
      <div class="block one" aria-hidden="true"></div>
      <div class="block two" aria-hidden="true"></div>
      <div class="block three" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
