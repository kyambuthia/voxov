name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            xvfb \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Configure
        run: |
          cmake -S . -B build/desktop/release-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOXOV_BUILD_TESTS=OFF \
            -DUSE_AVX2=OFF \
            -DUSE_F16C=OFF \
            -DUSE_FMADD=OFF \
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build/desktop/release-linux --parallel

      - name: Prepare linux artifact bundle
        run: |
          ASSET_DIR="VOXOV-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "${ASSET_DIR}/assets" "${ASSET_DIR}/docs"
          cp build/desktop/release-linux/bin/voxov "${ASSET_DIR}/"
          cp build/desktop/release-linux/bin/voxov_server "${ASSET_DIR}/"
          chmod +x "${ASSET_DIR}/voxov" "${ASSET_DIR}/voxov_server"
          cp -R assets/fonts "${ASSET_DIR}/assets/"
          cp docs/CROSS_PLATFORM_PLAY.md "${ASSET_DIR}/docs/MULTIPLAYER.md"
          cat > "${ASSET_DIR}/run.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "${SCRIPT_DIR}/voxov" "$@"
          EOF
          cat > "${ASSET_DIR}/host.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "${SCRIPT_DIR}/voxov_server" --lan "$@"
          EOF
          chmod +x "${ASSET_DIR}/run.sh"
          chmod +x "${ASSET_DIR}/host.sh"
          tar -czf "${ASSET_DIR}.tar.gz" "${ASSET_DIR}"

      - name: Validate linux artifact bundle
        run: |
          ASSET_DIR="VOXOV-${GITHUB_REF_NAME}-linux-x86_64"
          ASSET_TGZ="${ASSET_DIR}.tar.gz"
          mkdir -p smoke-linux
          tar -xzf "${ASSET_TGZ}" -C smoke-linux
          test -x "smoke-linux/${ASSET_DIR}/voxov"
          test -x "smoke-linux/${ASSET_DIR}/voxov_server"
          test -x "smoke-linux/${ASSET_DIR}/run.sh"
          test -x "smoke-linux/${ASSET_DIR}/host.sh"
          test -f "smoke-linux/${ASSET_DIR}/assets/fonts/IBMPlexMono-Regular.ttf"
          test -f "smoke-linux/${ASSET_DIR}/docs/MULTIPLAYER.md"
          ldd "smoke-linux/${ASSET_DIR}/voxov" | tee /tmp/voxov-linux-ldd.txt
          if grep -q "not found" /tmp/voxov-linux-ldd.txt; then
            echo "Unresolved runtime dependency in linux bundle"
            exit 1
          fi
          ldd "smoke-linux/${ASSET_DIR}/voxov_server" | tee /tmp/voxov-server-linux-ldd.txt
          if grep -q "not found" /tmp/voxov-server-linux-ldd.txt; then
            echo "Unresolved runtime dependency in linux server bundle"
            exit 1
          fi
          "smoke-linux/${ASSET_DIR}/voxov_server" --port 37777 --loopback-only \
            >/tmp/voxov-linux-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          sleep 1
          if ! kill -0 "${server_pid}" 2>/dev/null; then
            echo "Linux bundled server exited during startup"
            cat /tmp/voxov-linux-server.log
            exit 1
          fi
          set +e
          timeout 10s xvfb-run -a "smoke-linux/${ASSET_DIR}/run.sh" \
            --connect 127.0.0.1 --port 37777 >/tmp/voxov-linux-smoke.log 2>&1
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
            echo "Linux bundle startup smoke test failed (rc=${smoke_rc})"
            cat /tmp/voxov-linux-smoke.log
            exit 1
          fi
          if ! grep -q "NetClient: connected" /tmp/voxov-linux-smoke.log; then
            echo "Linux bundled client did not connect to bundled server"
            cat /tmp/voxov-linux-server.log
            cat /tmp/voxov-linux-smoke.log
            exit 1
          fi
          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

      - name: Upload linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: VOXOV-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build/desktop/release-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVOXOV_BUILD_TESTS=OFF `
            -DENABLE_ALL_WARNINGS=OFF `
            -DJPH_USE_DX12=OFF `
            -DJPH_USE_DXC=OFF `
            -DUSE_AVX2=OFF `
            -DUSE_F16C=OFF `
            -DUSE_FMADD=OFF `
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build/desktop/release-windows --parallel

      - name: Prepare windows artifact
        shell: powershell
        run: |
          $AssetDir = "VOXOV-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$AssetDir/assets", "$AssetDir/docs" | Out-Null
          Copy-Item "build/desktop/release-windows/bin/voxov.exe" "$AssetDir/" -Force
          Copy-Item "build/desktop/release-windows/bin/voxov_server.exe" "$AssetDir/" -Force
          Copy-Item "build/desktop/release-windows/bin/*.dll" "$AssetDir/" -ErrorAction SilentlyContinue
          Copy-Item "assets/fonts" "$AssetDir/assets/" -Recurse -Force
          Copy-Item "docs/CROSS_PLATFORM_PLAY.md" "$AssetDir/docs/MULTIPLAYER.md" -Force
          $AssetZip = "$AssetDir.zip"
          Compress-Archive -Path "$AssetDir/*" -DestinationPath $AssetZip -Force

      - name: Validate windows artifact bundle
        shell: powershell
        run: |
          $AssetDir = "VOXOV-$env:GITHUB_REF_NAME-windows-x86_64"
          $AssetZip = "$AssetDir.zip"
          $SmokeDir = Join-Path $PWD "smoke-windows"
          if (Test-Path $SmokeDir) { Remove-Item $SmokeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $SmokeDir | Out-Null
          Expand-Archive -Path $AssetZip -DestinationPath $SmokeDir -Force
          if (-not (Test-Path "$SmokeDir/voxov.exe")) { throw "voxov.exe missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/voxov_server.exe")) { throw "voxov_server.exe missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libgcc_s_seh-1.dll")) { throw "libgcc_s_seh-1.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libstdc++-6.dll")) { throw "libstdc++-6.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/libwinpthread-1.dll")) { throw "libwinpthread-1.dll missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/assets/fonts/IBMPlexMono-Regular.ttf")) { throw "IBMPlexMono-Regular.ttf missing from windows bundle" }
          if (-not (Test-Path "$SmokeDir/docs/MULTIPLAYER.md")) { throw "multiplayer guide missing from windows bundle" }
          $ServerOut = Join-Path $SmokeDir "server.stdout.log"
          $ServerErr = Join-Path $SmokeDir "server.stderr.log"
          $ClientOut = Join-Path $SmokeDir "client.stdout.log"
          $ClientErr = Join-Path $SmokeDir "client.stderr.log"
          $server = Start-Process -FilePath "$SmokeDir/voxov_server.exe" -WorkingDirectory $SmokeDir `
            -ArgumentList "--port", "37777", "--loopback-only" -PassThru `
            -RedirectStandardOutput $ServerOut -RedirectStandardError $ServerErr
          try {
            Start-Sleep -Seconds 1
            if ($server.HasExited) { throw "voxov_server.exe exited during startup" }
            $client = Start-Process -FilePath "$SmokeDir/voxov.exe" -WorkingDirectory $SmokeDir `
              -ArgumentList "--connect", "127.0.0.1", "--port", "37777" -PassThru `
              -RedirectStandardOutput $ClientOut -RedirectStandardError $ClientErr
            try {
              Start-Sleep -Seconds 5
              if ($client.HasExited -and $client.ExitCode -ne 0) {
                throw "voxov.exe exited early with code $($client.ExitCode)"
              }
              if (-not $client.HasExited) {
                Stop-Process -Id $client.Id -Force
                Wait-Process -Id $client.Id -ErrorAction SilentlyContinue
              }
              $ClientLog = ((Get-Content $ClientOut -ErrorAction SilentlyContinue) +
                (Get-Content $ClientErr -ErrorAction SilentlyContinue)) -join "`n"
              if ($ClientLog -notmatch "NetClient: connected") {
                throw "bundled Windows client did not connect to bundled server"
              }
            } finally {
              if ($client -and -not $client.HasExited) { Stop-Process -Id $client.Id -Force }
            }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Upload windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: VOXOV-${{ github.ref_name }}-windows-x86_64.zip

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Decode test keystore
        run: |
          echo "${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/voxov-test-upload.jks"

      - name: Build signed APK (Release)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/voxov-test-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK contains native library
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "${APK_PATH}"
          unzip -l "${APK_PATH}" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libvoxov.so" /tmp/apk-contents.txt

      - name: Prepare android artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "VOXOV-${GITHUB_REF_NAME}-android-arm64-v8a.apk"

      - name: Upload android artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: VOXOV-${{ github.ref_name }}-android-arm64-v8a.apk

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gzip

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Configure
        run: emcmake cmake -S . -B build/web/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/web/release --parallel

      - name: Optimize wasm
        run: |
          wasm-opt -Oz build/web/release/bin/voxov_web.wasm -o build/web/release/bin/voxov_web.opt.wasm
          mv build/web/release/bin/voxov_web.opt.wasm build/web/release/bin/voxov_web.wasm

      - name: Prepare web artifact
        run: |
          WEB_DIR="VOXOV-${GITHUB_REF_NAME}-web"
          mkdir -p "${WEB_DIR}"
          cp build/web/release/bin/voxov_web.html "${WEB_DIR}/"
          cp build/web/release/bin/voxov_web.js "${WEB_DIR}/"
          cp build/web/release/bin/voxov_web.wasm "${WEB_DIR}/"
          cp build/web/release/bin/voxov_web.data "${WEB_DIR}/"
          gzip -9 -k "${WEB_DIR}/voxov_web.html"
          gzip -9 -k "${WEB_DIR}/voxov_web.js"
          gzip -9 -k "${WEB_DIR}/voxov_web.wasm"
          gzip -9 -k "${WEB_DIR}/voxov_web.data"

      - name: Validate web artifact
        run: |
          WEB_DIR="VOXOV-${GITHUB_REF_NAME}-web"
          test -f "${WEB_DIR}/voxov_web.html"
          test -f "${WEB_DIR}/voxov_web.js"
          test -f "${WEB_DIR}/voxov_web.wasm"
          test -f "${WEB_DIR}/voxov_web.data"
          test -f "${WEB_DIR}/voxov_web.html.gz"
          test -f "${WEB_DIR}/voxov_web.js.gz"
          test -f "${WEB_DIR}/voxov_web.wasm.gz"
          test -f "${WEB_DIR}/voxov_web.data.gz"

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: VOXOV-${{ github.ref_name }}-web/*

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android, build-web]
    permissions:
      contents: write

    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist/release-linux

      - name: Download android artifact
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: dist/release-android

      - name: Download windows artifact
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist/release-windows

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web
          path: dist/release-web

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -print -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "VOXOV ${GITHUB_REF_NAME} (Desktop Server/Linux/Windows/Android/Web)" \
            --generate-notes
