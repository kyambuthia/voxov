name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Configure
        run: cmake -S . -B build/desktop/ci -G Ninja -DVOXOV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/desktop/ci --parallel

      - name: Test
        run: ctest --test-dir build/desktop/ci --output-on-failure

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Configure
        run: emcmake cmake -S . -B build/web/ci -G Ninja

      - name: Build
        run: cmake --build build/web/ci --parallel

      - name: Smoke check web artifact
        run: test -f build/web/ci/bin/voxov_web.html

  android-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Emulator runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait for Android package manager service; sys.boot_completed can be true before it's ready.
            for i in $(seq 1 60); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.voxov.game/android.app.NativeActivity
            sleep 5
            app_pid="$(adb shell pidof com.voxov.game | tr -d '\r')"
            test -n "${app_pid}"
