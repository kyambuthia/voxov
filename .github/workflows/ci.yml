name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libasound2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Configure
        run: cmake -S . -B build/desktop/ci -G Ninja -DVOXOV_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build/desktop/ci --parallel

      - name: Test
        run: ctest --test-dir build/desktop/ci --output-on-failure

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build/desktop/ci-win -G Ninja `
            -DVOXOV_BUILD_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Debug `
            -DENABLE_ALL_WARNINGS=OFF `
            -DJPH_USE_DX12=OFF `
            -DJPH_USE_DXC=OFF `
            -DUSE_AVX2=OFF `
            -DUSE_F16C=OFF `
            -DUSE_FMADD=OFF `
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build/desktop/ci-win --parallel

      - name: Test
        run: ctest --test-dir build/desktop/ci-win --output-on-failure

  build-web:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 3.1.61
      EM_CACHE: ${{ github.workspace }}/build/web/ci/cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE }}
          key: emscripten-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Configure
        run: emcmake cmake -S . -B build/web/ci -G Ninja

      - name: Build
        run: cmake --build build/web/ci --parallel

      - name: Report wasm size
        run: |
          wc -c build/web/ci/bin/voxov_web.wasm | awk '{print "WASM size: " $1 " bytes (" $1/1024/1024 " MB)"}'

      - name: Smoke check web artifact
        run: test -f build/web/ci/bin/voxov_web.html

      - name: Upload web dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dev-build
          path: |
            build/web/ci/bin/voxov_web.html
            build/web/ci/bin/voxov_web.js
            build/web/ci/bin/voxov_web.wasm
            build/web/ci/bin/voxov_web.data
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Emulator runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1800
          disable-animations: true
          script: |
            # Wait for Android package manager service; sys.boot_completed can be true before it's ready.
            for i in $(seq 1 60); do adb shell cmd package list packages >/dev/null 2>&1 && break; sleep 2; done
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.voxov.game/android.app.NativeActivity
            sleep 5
            for i in $(seq 1 20); do adb shell pidof com.voxov.game 2>/dev/null | grep -Eq '[0-9]' && exit 0; sleep 2; done; exit 1
