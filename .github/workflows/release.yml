name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            cmake \
            ninja-build \
            glslc \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Install DXC
        run: |
          DXC_VERSION="v1.8.2505.1"
          DXC_ARCHIVE="linux_dxc_2025_07_14.x86_64.tar.gz"
          curl -L -o "${DXC_ARCHIVE}" "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VERSION}/${DXC_ARCHIVE}"
          tar -xzf "${DXC_ARCHIVE}"
          sudo install -m 0755 bin/dxc /usr/local/bin/dxc
          sudo install -m 0644 lib/libdxcompiler.so /usr/local/lib/libdxcompiler.so
          sudo install -m 0644 lib/libdxil.so /usr/local/lib/libdxil.so
          sudo ldconfig
          sudo ln -sf /usr/local/bin/dxc /bin/dxc

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOXOV_BUILD_TESTS=OFF \
            -DUSE_AVX2=OFF \
            -DUSE_F16C=OFF \
            -DUSE_FMADD=OFF \
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare executable artifact
        run: |
          ASSET="VOXOV-${GITHUB_REF_NAME}-linux-x86_64"
          cp build/bin/voxov "${ASSET}"
          chmod +x "${ASSET}"

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: VOXOV-${{ github.ref_name }}-linux-x86_64

  build-windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install DXC
        shell: powershell
        run: |
          $DXC_VERSION = "v1.8.2505.1"
          $DXC_ARCHIVE = "dxc_2025_07_14.zip"
          $URL = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_VERSION/$DXC_ARCHIVE"
          Invoke-WebRequest -Uri $URL -OutFile $DXC_ARCHIVE
          Expand-Archive -Path $DXC_ARCHIVE -DestinationPath dxc -Force
          "$PWD\dxc\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVOXOV_BUILD_TESTS=OFF `
            -DVOXOV_ENABLE_VULKAN=OFF `
            -DUSE_AVX2=OFF `
            -DUSE_F16C=OFF `
            -DUSE_FMADD=OFF `
            -DUSE_LZCNT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare windows artifact
        shell: powershell
        run: |
          $AssetZip = "VOXOV-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Compress-Archive -Path "build/bin/voxov.exe" -DestinationPath $AssetZip -Force

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: VOXOV-${{ github.ref_name }}-windows-x86_64.zip

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DANDROID=ON \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-android --parallel

      - name: Prepare android artifact
        run: |
          cp build-android/lib/libvoxov.so "VOXOV-${GITHUB_REF_NAME}-android-arm64-v8a-libvoxov.so"

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: VOXOV-${{ github.ref_name }}-android-arm64-v8a-libvoxov.so

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]
    if: always()

    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist/release-linux
          if-no-files-found: error

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/release-android
          if-no-files-found: error

      - name: Download windows artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/release-windows

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -print -exec cp {} release/ \;
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VOXOV ${{ github.ref_name }} (Linux/Windows/Android)
          generate_release_notes: true
          files: release/*
