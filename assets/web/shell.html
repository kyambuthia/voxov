<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VOXOV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090c14;
      font-family: monospace;
      overscroll-behavior: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      border: none;
      outline: none;
      background: #090c14;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    const voxovParams = new URLSearchParams(window.location.search);
    const voxovProxyScheme = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const voxovProxyUrl = voxovParams.get('proxy') ||
      `${voxovProxyScheme}//${window.location.hostname || '127.0.0.1'}:8080`;
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      websocket: { url: voxovProxyUrl, subprotocol: 'binary' },
      __voxovNetApiReady: true,
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      setStatus: function(text) {
        if (!text) return;
        console.log('[wasm] ' + text);
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
      },
      onRuntimeInitialized: function() {
        console.log('[VOXOV] runtime ready');
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
