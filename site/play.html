<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play VOXOV</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090c14;
      color: #f4f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      border: 0;
      background: #090c14;
    }
  </style>
</head>
<body>
  <iframe
    src="voxov_web.html"
    title="VOXOV"
    allow="fullscreen; gamepad; autoplay"
    allowfullscreen>
  </iframe>
</body>
</html>
